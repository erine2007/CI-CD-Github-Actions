name: TrainShop Starter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-api:
    name: Tester API
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: api
        run: npm install

      - name: Vérifier la qualité du code
        working-directory: api
        run: npm run lint

      - name: Lancer les tests
        working-directory: api
        run: npm test

  docker-build:
    name: Vérifier les builds Docker
    runs-on: ubuntu-latest
    needs: test-api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: trainshop
          POSTGRES_PASSWORD: trainshop
          POSTGRES_DB: trainshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Initialiser la base de données
        run: |
          psql postgresql://trainshop:trainshop@localhost:5432/trainshop \
            -f database/init/001-init.sql

      - name: Construire l'image Docker de l'API
        run: docker build -t trainshop-api ./api

      - name: Construire l'image Docker du frontend
        run: docker build -t trainshop-frontend ./frontend

      - name: Lancer le container de l'API
        run: |
          docker run -d -p 3000:3000 \
            --name trainshop-api-test \
            --network host \
            -e DATABASE_URL="postgresql://trainshop:trainshop@localhost:5432/trainshop" \
            trainshop-api

      - name: Attendre que l'API démarre
        run: |
          echo "Attente du démarrage..."
          for i in {1..15}; do
            curl -s http://localhost:3000/health && echo "✅ API prête" && exit 0
            echo "Tentative $i/15..."
            sleep 2
          done
          echo "❌ L'API n'a pas démarré"
          docker logs trainshop-api-test
          exit 1

      - name: Tester la route /health
        run: |
          curl --fail http://localhost:3000/health
          echo "✅ /health répond correctement"

      - name: Nettoyer le container
        if: always()
        run: docker rm -f trainshop-api-test